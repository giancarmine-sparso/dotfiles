# ~/.config/kitty/kitty.conf
# ============================================================
# Kitty config — Catppuccin (Mocha)
# ============================================================

# -----------------------
# Fonts
# -----------------------
# font_family      family="CommitMonoGian"
# bold_font        auto
# italic_font      auto
# bold_italic_font auto

font_size        12.0

# Nerd Font icons fallback
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFD,U+100000-U+10FFFD,U+23FB-U+23FE,U+2B58,U+2665,U+26A1 JetBrainsMono Nerd Font Mono

# ----------------------
# Window / Layout
# ----------------------

# background_opacity 0.85
# dynamic_background_opacity true 
linux_display_server    auto
window_padding_width    10
window_margin_width     4
enable_audio_bell       no
repaint_delay           10
input_delay             3
hide_window_decorations no
draw_minimal_borders    yes
initial_window_width    100c
initial_window_height   32c
confirm_os_window_close 0
shell /usr/bin/zsh
# ----------------------
# Scrollback
# ----------------------
scrollback_lines        10000
scrollback_pager        less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER


# ----------------------
# Cursor
# ----------------------
cursor_shape               beam
cursor_beam_thickness      1.8
cursor_blink_interval      -1
cursor_stop_blinking_after 15.0
#cursor_trail               3
#cursor_trail_decay         0.1 0.4
#cursor_trail_start_threshold 2
cursor_shape_unfocused     hollow

# ----------------------
# Clipboard
# ----------------------
copy_on_select          clipboard

# ----------------------
# Shell integration
# ----------------------
shell_integration       enabled no-cursor

# ----------------------
# Remote control
# ----------------------
allow_remote_control    yes
listen_on               unix:/tmp/kitty

# ----------------------
# Layouts & splits
# ----------------------
enabled_layouts         splits,tall,stack

map ctrl+shift+enter    launch --cwd=current --location=vsplit
map ctrl+shift+o        launch --cwd=current --location=hsplit
map ctrl+shift+l        next_layout
map alt+h               neighboring_window left
map alt+j               neighboring_window down
map alt+k               neighboring_window up
map alt+l               neighboring_window right
map ctrl+shift+r        start_resizing_window

# ----------------------
# Tabs
# ----------------------
tab_bar_edge                top
tab_bar_style               powerline
tab_powerline_style         slanted
tab_bar_min_tabs            0
tab_title_template          "{fmt.fg._f99157}󰆍 {fmt.fg.tab} {title}"
active_tab_title_template   "{fmt.bold}{fmt.fg._f99157}󰄛"

# ----------------------
# Theme
# ----------------------


# BEGIN_KITTY_THEME
# Kanagawa_dragon
include current-theme.conf
# END_KITTY_THEME


# BEGIN_KITTY_FONTS
font_family      family=CommitMonoGian postscript_name=CommitMonoGian-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS